<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login - DeepAuth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      background: linear-gradient(-45deg, #030305, #080811, #0a0a16, #020205);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Particle Canvas */
    #goldParticles {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Ultra-Premium Grid and Scanline */
    .cyber-grid {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
      transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
      animation: gridMove 20s linear infinite;
    }
    
    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 0 40px; }
    }

    .global-scanline {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 15vh;
      background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, 0.08), transparent);
      animation: scanOverlay 5s linear infinite;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: screen;
    }

    @keyframes scanOverlay {
      0% { transform: translateY(-100vh); }
      100% { transform: translateY(100vh); }
    }

    /* Ambient background glows */
    .ambient-glow-1 {
      position: absolute; top: -10%; left: -10%; width: 50vw; height: 50vw;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 2;
    }
    
    .ambient-glow-2 {
      position: absolute; bottom: -20%; right: -10%; width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(112, 0, 255, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 2;
    }

    /* Layout */
    .login-wrapper {
      display: flex;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      align-items: center;
      justify-content: center;
      gap: 40px;
      position: relative;
      z-index: 10;
    }

    /* Left Panel - Animation */
    .left-panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .ai-orb-container {
      position: relative;
      width: 300px;
      height: 300px;
    }

    .ai-orb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      box-shadow: 0 0 60px rgba(0, 240, 255, 0.3), inset 0 0 40px rgba(0, 240, 255, 0.15);
      animation: breathe 4s ease-in-out infinite alternate;
      position: relative;
    }
    
    .orbit-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 120%; height: 120%;
      border: 1px dashed rgba(0, 240, 255, 0.3);
      border-radius: 50%;
      animation: spin 20s linear infinite;
    }

    .orbit-ring::before {
      content: "";
      position: absolute;
      top: -5px; left: 50%;
      width: 10px; height: 10px;
      background: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 15px #00f0ff;
    }

    .scanner-line {
      position: absolute;
      width: 150%;
      height: 2px;
      background: #00f0ff;
      box-shadow: 0 0 20px 5px rgba(0, 240, 255, 0.4);
      top: 0;
      left: -25%;
      animation: scan 3s ease-in-out infinite;
      z-index: 5;
    }

    @keyframes breathe {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes scan {
      0%, 100% { top: 10%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      50% { top: 90%; }
    }

    @keyframes spin {
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Right Panel - Auth Cards */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 400px;
      width: 100%;
    }

    .auth-card {
      position: relative;
      background: rgba(8, 8, 14, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(0, 240, 255, 0.1);
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .auth-card.secondary {
      padding: 20px;
      border-radius: 12px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-text { 
      font-size: 32px; color: #00f0ff; font-weight: 700; letter-spacing: -1px; margin: 0 0 30px 0; 
      text-transform: uppercase;
      animation: glitchText 3s infinite;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5), 2px 2px 0px rgba(112, 0, 255, 0.5);
    }
    
    @keyframes glitchText {
      0%, 100% { text-shadow: 0 0 10px rgba(0, 240, 255, 0.5), 2px 2px 0px rgba(112, 0, 255, 0.5); transform: translate(0); }
      10% { text-shadow: -2px 0 rgba(0, 240, 255, 0.8), 2px 0 rgba(112, 0, 255, 0.8); transform: translate(-2px, 1px); }
      15% { text-shadow: 2px 0 rgba(0, 240, 255, 0.8), -2px 0 rgba(112, 0, 255, 0.8); transform: translate(2px, -1px); }
      20% { text-shadow: 0 0 10px rgba(0, 240, 255, 0.5), 2px 2px 0px rgba(112, 0, 255, 0.5); transform: translate(0); }
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px 18px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
      color: white;
      box-sizing: border-box;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    
    input[type="text"]:focus, input[type="password"]:focus { 
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }
    
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #aaa;
      cursor: pointer;
    }

    .forgot-pass {
      color: #00f0ff;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    
    .forgot-pass:hover { opacity: 0.8; }

    button.primary-btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: linear-gradient(90deg, #7000ff, #00f0ff);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    button.primary-btn::before {
      content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: all 0.5s ease;
    }

    button.primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(112, 0, 255, 0.4);
    }
    button.primary-btn:hover::before { left: 100%; }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #666;
      margin: 25px 0;
      font-size: 12px;
      font-weight: 600;
    }

    .divider::before, .divider::after {
      content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }

    .social-login {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .social-btn:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.3);
    }

    .error {
      color: #ff4b5c;
      background: rgba(255, 75, 92, 0.1);
      border: 1px solid rgba(255, 75, 92, 0.3);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    
    .link { color: #00f0ff; text-decoration: none; font-weight: 600; }
    .link:hover { text-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }

    /* Security Badge */
    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      color: #aaa;
      margin-top: 25px;
    }

    @media (max-width: 768px) {
      .left-panel { display: none; }
      .login-wrapper { padding: 20px; }
    }
  </style>
</head>
<body>
  <!-- Ultra Premium Overlays -->
  <div class="cyber-grid"></div>
  <div class="global-scanline"></div>
  
  <!-- Particles Canvas -->
  <canvas id="goldParticles"></canvas>
  
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
  
  <div class="login-wrapper">
    <!-- Left Animation Panel -->
    <div class="left-panel">
      <div class="ai-orb-container">
        <div class="orbit-ring"></div>
        <div class="ai-orb"></div>
        <div class="scanner-line"></div>
      </div>
    </div>

    <!-- Right Login Forms -->
    <div class="right-panel">
      <div class="auth-card">
        <h1 class="logo-text">DeepAuth</h1>
        
        {% if error %}
          <div class="error">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
          <input type="text" name="username" placeholder="Username" required autofocus>
          <input type="password" name="password" placeholder="Password" required>
          
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="remember"> Remember me
            </label>
            <a href="#" class="forgot-pass">Forgot password?</a>
          </div>

          <button type="submit" class="primary-btn">Sign In</button>
        </form>

        <div class="divider">OR</div>

        <div class="social-login">
          <button class="social-btn" type="button" onclick="alert('Social login mocked for demo')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"></path></svg>
            Log in with Google
          </button>
          <button class="social-btn" type="button" onclick="alert('Social login mocked for demo')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path></svg>
            Log in with GitHub
          </button>
        </div>

        <div class="security-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          End-to-end encrypted session
        </div>
      </div>
      
      <!-- Signup Separate Card -->
      <div class="auth-card secondary">
        <p style="margin:0; font-size:14px; color:#ccc;">
          Don't have an account? <a href="{{ url_for('signup') }}" class="link">Sign up</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // --- Golden Particles Animation ---
    const canvas = document.getElementById("goldParticles");
    const ctx = canvas.getContext("2d");
    let particles = [];
    
    function resizeCanvas() { 
      canvas.width = window.innerWidth; 
      canvas.height = window.innerHeight; 
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.radius = Math.random() * 2 + 1;
        this.alpha = Math.random() * 0.5 + 0.1;
      }
      update() {
        this.x += this.vx; 
        this.y += this.vy;
        
        // Wrap around edges
        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
      }
      draw() {
        ctx.beginPath(); 
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 240, 255, ${this.alpha})`; 
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#00f0ff";
        ctx.fill();
        ctx.shadowBlur = 0; // reset
      }
    }
    
    // Create particles based on screen size (less density on mobile)
    const particleCount = window.innerWidth < 768 ? 40 : 100;
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }
    
    function animateParticles() {
      requestAnimationFrame(animateParticles);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw faint connections
      for(let i=0; i<particles.length; i++) {
        for(let j=i+1; j<particles.length; j++) {
           const dx = particles[i].x - particles[j].x;
           const dy = particles[i].y - particles[j].y;
           const dist = Math.sqrt(dx*dx + dy*dy);
           
           if(dist < 120) {
             ctx.beginPath();
             ctx.moveTo(particles[i].x, particles[i].y);
             ctx.lineTo(particles[j].x, particles[j].y);
             ctx.strokeStyle = `rgba(0, 240, 255, ${0.1 * (1 - dist/120)})`;
             ctx.lineWidth = 0.5;
             ctx.stroke();
           }
        }
      }
      
      particles.forEach(p => { p.update(); p.draw(); });
    }
    animateParticles();
  </script>
</body>
</html>
